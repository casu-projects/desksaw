name: Build macOS App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  export-mac:
    runs-on: ubuntu-latest
    container:
      # Rapier2D 요구 버전인 Godot 4.4 (.NET) Docker 공식 이미지 사용
      image: barichello/godot-ci:4.4-mono

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mkdir -v -p build/mac
          # Godot 4.4 mono 익스포트 템플릿 설치
          wget https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_mono_export_templates.tpz
          unzip Godot_v4.4-stable_mono_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.4.stable.mono

      # 1차: 에셋 가상 인덱싱 (UID 및 텍스처 임포트 처리)
      - name: Import Assets
        run: |
          godot --headless --editor --quit || true

      # 2차: 실제 macOS zip 빌드
      - name: Export macOS Game
        run: |
          godot --headless --export-release "macOS" build/mac/desksaw.zip

      # 빌드 결과물 저장
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desksaw-macOS
          path: build/mac/desksaw.zip
