name: Build macOS App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  export-mac:
    runs-on: ubuntu-latest
    name: Export macOS Game
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Godot 4.7.1 & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p build/mac
          mkdir -p /home/runner/godot_engine

          # 1. Godot 4.7.1-stable Mono Engine 다운로드 (프로젝트/GodotSharp 버전과 일치)
          wget https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.7.1-stable_mono_linux_x86_64.zip -d /home/runner/godot_engine

          # GodotSharp 디렉터리 보존을 위해 심볼릭 링크 연결
          GODOT_BIN=$(find /home/runner/godot_engine -name "Godot_v4.7.1-stable_mono_linux.x86_64")
          sudo ln -s "$GODOT_BIN" /usr/local/bin/godot

          # 2. Export Templates 다운로드 및 설치
          wget https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz
          unzip -q Godot_v4.7.1-stable_mono_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.7.1.stable.mono

      # C# 어셈블리 빌드 (autoload/임포트 에러 방지)
      - name: Build C# Project
        run: |
          dotnet build StartingOver.csproj -c Debug

      # 텍스처 임포트 및 UID 캐시 생성
      - name: Import Assets
        run: |
          godot --headless --import || true

      # macOS .app 구조 패키지로 빌드 (Godot 4.7이 임시 서명+entitlements 처리)
      - name: Export macOS Game (.app)
        run: |
          godot --headless --export-release "macOS" build/mac/desksaw.app

      # 실행 권한 부여 + rcodesign 재서명 + zip 압축
      # (Godot 내장 리눅스 서명은 macOS가 거부하는 2중 CodeDirectory를 생성하므로,
      #  검증된 rcodesign으로 번들 전체를 재서명한다)
      - name: Fix Permissions, Ad-hoc Sign, and Zip
        run: |
          # 1. macOS 바이너리 및 프레임워크 실행 권한 부여
          chmod -R +x build/mac/desksaw.app/Contents/MacOS/

          # 2. Linux용 apple-codesign 도구 설치
          curl -LO https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.28.0/apple-codesign-0.28.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf apple-codesign-0.28.0-x86_64-unknown-linux-musl.tar.gz

          # 3. 임시 서명(Ad-hoc Code Sign) 재적용 (Godot 내장 서명 덮어쓰기)
          ./apple-codesign-0.28.0-x86_64-unknown-linux-musl/rcodesign sign build/mac/desksaw.app

          # 4. Zip으로 압축
          cd build/mac
          zip -r desksaw-macOS.zip desksaw.app

      # 아티팩트 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desksaw-macOS
          path: build/mac/desksaw-macOS.zip
