name: Build macOS App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  export-mac:
    runs-on: ubuntu-latest
    name: Export macOS Game
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Godot 4.6 & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p build/mac
          mkdir -p /home/runner/godot_engine

          # Godot 4.6-dev3 mono 다운로드
          wget https://github.com/godotengine/godot-builds/releases/download/4.6-dev3/Godot_v4.6-dev3_mono_linux_x86_64.zip
          unzip -q Godot_v4.6-dev3_mono_linux_x86_64.zip -d /home/runner/godot_engine

          # 실행 파일 심볼릭 링크 등록
          GODOT_BIN=$(find /home/runner/godot_engine -name "Godot_v4.6-dev3_mono_linux.x86_64")
          sudo ln -s "$GODOT_BIN" /usr/local/bin/godot

          # 4.6 Export Templates 다운로드 및 설치
          wget https://github.com/godotengine/godot-builds/releases/download/4.6-dev3/Godot_v4.6-dev3_mono_export_templates.tpz
          unzip -q Godot_v4.6-dev3_mono_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.6.dev3.mono

      # 1단계: 텍스처 압축 및 전체 에셋 임포트 (UID 캐시 갱신)
      - name: Import Assets
        run: |
          godot --headless --import || true

      # 2단계: macOS 네이티브 빌드 (.zip)
      - name: Export macOS Game
        run: |
          godot --headless --export-release "macOS" build/mac/desksaw.zip

      # 3단계: 완성본 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desksaw-macOS
          path: build/mac/desksaw.zip
