name: Build macOS App

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  export-mac:
    runs-on: ubuntu-latest
    name: Export macOS Game
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Godot 4.4 & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p build/mac

          # Godot 4.4-mono 다운로드 및 설치
          wget https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_mono_linux_x86_64.zip
          unzip -q Godot_v4.4-stable_mono_linux_x86_64.zip
          sudo mv Godot_v4.4-stable_mono_linux_x86_64/Godot_v4.4-stable_mono_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          # Export Templates 다운로드 및 설치
          wget https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_mono_export_templates.tpz
          unzip -q Godot_v4.4-stable_mono_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.4.stable.mono

      # 1단계: 프로젝트 에셋 및 UID, 텍스처 가상 인덱싱
      - name: Import Assets
        run: |
          godot --headless --editor --quit || true

      # 2단계: macOS 네이티브 빌드 (.zip)
      - name: Export macOS Game
        run: |
          godot --headless --export-release "macOS" build/mac/desksaw.zip

      # 3단계: 완성본 업로드
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desksaw-macOS
          path: build/mac/desksaw.zip
